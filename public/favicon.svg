<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563eb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#9333ea;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Background with rounded corners -->
  <rect width="100" height="100" rx="20" fill="url(#grad)"/>
  <!-- Graduation Cap Icon (simplified and optimized for small size) -->
  <g transform="translate(50, 45)">
    <!-- Cap top (main part) -->
    <path d="M -28,-12 Q 0,-22 28,-12 L 28,-2 Q 0,-10 -28,-2 Z" fill="white" opacity="0.95"/>
    <!-- Cap base -->
    <rect x="-28" y="-2" width="56" height="8" fill="white" opacity="0.9"/>
    <!-- Tassel on the right -->
    <line x1="20" y1="-2" x2="20" y2="12" stroke="white" stroke-width="2.5" stroke-linecap="round" opacity="0.9"/>
    <circle cx="20" cy="12" r="3.5" fill="white" opacity="0.9"/>
  </g>
</svg>
