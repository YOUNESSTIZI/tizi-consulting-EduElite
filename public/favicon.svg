<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563eb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#9333ea;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Background with rounded corners -->
  <rect width="100" height="100" rx="20" fill="url(#grad)"/>
  <!-- Graduation Cap Icon - better proportions for small size -->
  <g transform="translate(50, 50)">
    <!-- Cap top (main curved part) - wider and more visible -->
    <path d="M -30,-8 Q 0,-18 30,-8 L 30,2 Q 0,-6 -30,2 Z" fill="white" opacity="0.95" stroke="white" stroke-width="0.5" opacity="0.3"/>
    <!-- Cap base (square part) - more visible -->
    <rect x="-30" y="2" width="60" height="10" fill="white" opacity="0.9"/>
    <!-- Tassel on the right - more visible -->
    <line x1="22" y1="2" x2="22" y2="18" stroke="white" stroke-width="3" stroke-linecap="round" opacity="0.9"/>
    <circle cx="22" cy="18" r="4" fill="white" opacity="0.9"/>
  </g>
</svg>
